services:

  postgis:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_DB: geo
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
    # Default port: 5432 is free on this machine. The user's own containers
    # publish 27017, 8083 and 4873.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 5s
      timeout: 3s
      retries: 20
